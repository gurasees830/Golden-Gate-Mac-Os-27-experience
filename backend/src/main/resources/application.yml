spring:
  application:
    name: golden-gate-cloud
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/goldengate}
    username: ${DATABASE_USER:goldengate}
    password: ${DATABASE_PASSWORD:goldengate}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # Flyway owns the schema
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 14d
      cookie:
        name: GGSESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  max-preference-bytes: 262144
  login-max-attempts: 5
  login-lockout-minutes: 15
springdoc:
  swagger-ui:
    path: /swagger-ui.html
